<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2: Tweet Composer</title>
    <script src="https://unpkg.com/vue@3.5.26/dist/vue.global.js"></script>
    <style>
      textarea {
        resize: vertical;
      }

      .danger {
        color: red;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Task 2: Tweet Composer</h1>

      <textarea :class="{danger: hasLimitReached}" v-model="tweetText"></textarea>
      <p>Character count: {{ tweetText.length }}/{{ maxLimit }}</p>
      <p>Remaining characters: {{ hasLimitReached ? '⚠️' : remainingChars }}</p>

      <button :disabled="hasLimitReached">Post Tweet</button>
    </main>

    <script>
      const options = {
        data() {
          return {
            tweetText: 'the text turns red if limit reached',
            maxLimit: 36,
          };
        },

        computed: {
          remainingChars() {
            return this.maxLimit - this.tweetText.length;
          },
          hasLimitReached() {
            return this.remainingChars < 0;
          },
        },
      };

      const app = Vue.createApp(options);
      app.mount('#app');
    </script>
  </body>
</html>
