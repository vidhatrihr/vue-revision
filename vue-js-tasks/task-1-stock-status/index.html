<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1: Stock Status</title>
    <script src="https://unpkg.com/vue@3.5.27/dist/vue.global.js"></script>
    <style>
      .status {
        color: green;
      }

      .danger {
        color: red;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Task 1: Stock Status</h1>

      <p>Gaming Laptop</p>
      <p>Price: $200</p>
      <p :class="{'status': true, 'danger' : !inStock}">Status: {{ stockLabel }}</p>
      <p v-if="inStock">Inventory count: {{ inventoryCount }}</p>

      <button @click="toggleStock">Toggle status</button>
    </main>

    <script>
      const options = {
        data() {
          return {
            inStock: true,
            inventoryCount: 5,
          };
        },

        computed: {
          stockLabel() {
            return this.inStock ? 'In Stock' : 'Out of Stock';
          },
        },

        methods: {
          toggleStock() {
            this.inStock = !this.inStock;
          },
        },
      };

      const app = Vue.createApp(options);
      app.mount('#app');
    </script>
  </body>
</html>
